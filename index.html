<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Общее дело</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #E7E4D6;
    --note: #F3F0E4;
    --ink: #262A22;
    --pine: #33473A;
    --pine-deep: #223229;
    --barn: #A23F2E;
    --wheat: #C79A2E;
    --line: #C7C2AC;
    --muted: #6B6F5F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 90px;
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(0,0,0,0.03) 0, transparent 40%),
      radial-gradient(circle at 90% 75%, rgba(0,0,0,0.03) 0, transparent 40%);
    color: var(--ink);
  }
  header {
    background: var(--pine-deep);
    color: var(--paper);
    padding: 20px 16px 22px;
    border-bottom: 4px solid var(--barn);
  }
  header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #A9BBAE; margin-bottom: 6px;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 24px; margin: 0; line-height: 1.15;
  }
  h2 { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin: 16px 0 10px; }

  .content { padding: 0 16px; }

  .tabs {
    display: flex; margin: 16px 0 12px;
    border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden;
  }
  .tab {
    flex: 1; padding: 9px 0; text-align: center; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;
    background: var(--paper); color: var(--ink);
  }
  .tab.active { background: var(--ink); color: var(--paper); }

  input, select, textarea {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    border-radius: 6px; border: 1.5px solid var(--line);
    font-size: 14px; font-family: 'IBM Plex Sans', sans-serif;
    background: #fff; color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--pine); outline-offset: 1px; border-color: var(--pine);
  }

  .card {
    background: var(--note); border: 1px solid var(--line); border-radius: 3px;
    padding: 16px 16px 14px; margin-bottom: 22px; position: relative;
    box-shadow: 0 3px 0 rgba(0,0,0,0.04), 0 8px 16px -8px rgba(0,0,0,0.18);
  }
  .card::before {
    content: ''; position: absolute; top: -9px; left: 20px;
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #D8624A, var(--barn));
    box-shadow: 0 2px 3px rgba(0,0,0,0.35);
  }
  .card:nth-child(odd) { transform: rotate(-0.5deg); }
  .card:nth-child(even) { transform: rotate(0.6deg); }

  .card .type {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; margin-bottom: 8px;
  }
  .card .when {
    display: inline-flex; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--pine); border: 1.5px solid var(--pine); border-radius: 4px;
    padding: 2px 8px; transform: rotate(-1deg); margin-bottom: 10px;
  }
  .card .desc { font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; color: #4A4E42; }
  .card .who { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

  button {
    border: none; border-radius: 5px; padding: 10px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.01em;
  }
  .btn-primary { background: var(--pine); color: var(--paper); width: 100%; }
  .btn-join { background: var(--pine); color: var(--paper); }
  .btn-leave { background: var(--barn); color: var(--paper); }
  .btn-edit { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn-delete { background: transparent; color: var(--barn); border: 1.5px solid var(--barn); }
  .btn-chat { background: var(--wheat); color: var(--ink); width: 100%; margin-top: 8px; }
  .card-actions { display: flex; gap: 8px; }
  .card-actions button { flex: 1; }
  .owner-actions { margin-top: 8px; }

  .chat-msg { margin-bottom: 10px; }
  .chat-msg .who { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .chat-msg .text {
    font-size: 13.5px; background: #EFEBDC; border-radius: 8px;
    padding: 8px 11px; display: inline-block; border: 1px solid var(--line);
  }
  .chat-msg.own { text-align: right; }
  .chat-msg.own .text { background: var(--pine); color: var(--paper); border: none; }

  .chat-row { display: flex; gap: 8px; align-items: flex-start; }
  .chat-row input { margin-bottom: 0; }
  .chat-row button { width: auto; padding: 10px 16px; background: var(--pine); color: var(--paper); }

  .fab {
    position: fixed; bottom: 22px; right: 20px; width: 54px; height: 54px;
    border-radius: 50%; background: var(--barn); color: var(--paper);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 6px 14px -4px rgba(162,63,46,0.55); cursor: pointer;
  }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(34,50,41,0.45);
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--paper); width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto;
    border-top: 4px solid var(--barn);
  }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
  .cal-nav-btn {
    width: 34px; height: 34px; border-radius: 6px; background: var(--ink); color: var(--paper);
    font-size: 15px; font-weight: 700; padding: 0;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace;
  }
  .cal-day.has-event { background: var(--pine); color: var(--paper); font-weight: 600; }
  .cal-day.clickable { cursor: pointer; }
  .cal-head { font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 13.5px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Скооперируемся · посёлок</div>
  <h1>🏘️ Общее дело</h1>
</header>

<div class="content">

<div class="tabs">
  <div class="tab active" data-tab="list">Ближайшие</div>
  <div class="tab" data-tab="calendar">Календарь</div>
</div>

<input id="search-input" type="text" placeholder="🔍 Поиск по событиям (например: мусор)">

<div id="view-list"></div>
<div id="view-calendar" style="display:none"></div>

</div>

<div class="fab" id="fab-add">+</div>

<!-- Регистрация -->
<div class="modal-bg" id="reg-modal">
  <div class="modal">
    <h2>Давайте познакомимся</h2>
    <input id="reg-name" placeholder="Ваше имя">
    <input id="reg-address" placeholder="Адрес (улица, дом, кв./участок)">
    <button class="btn-primary" id="reg-save">Продолжить</button>
  </div>
</div>

<!-- Создание/редактирование события -->
<div class="modal-bg" id="create-modal">
  <div class="modal">
    <h2 id="create-modal-title">Новое событие</h2>
    <select id="ev-type">
      <option value="Вывоз мусора">Вывоз мусора</option>
      <option value="Субботник">Субботник</option>
      <option value="Закупка">Совместная закупка</option>
      <option value="Другое">Другое</option>
    </select>
    <input id="ev-type-custom" placeholder="Впишите своё название события" style="display:none">
    <input id="ev-date" type="date">
    <input id="ev-time" type="time">
    <textarea id="ev-desc" placeholder="Описание (необязательно)" rows="3"></textarea>
    <button class="btn-primary" id="ev-save">Создать</button>
  </div>
</div>

<!-- События выбранной даты -->
<div class="modal-bg" id="day-modal">
  <div class="modal">
    <h2 id="day-modal-title">События</h2>
    <div id="day-modal-list"></div>
  </div>
</div>

<!-- Чат участников события -->
<div class="modal-bg" id="chat-modal">
  <div class="modal">
    <h2 id="chat-modal-title">💬 Чат</h2>
    <div id="chat-messages"></div>
    <div class="chat-row">
      <input id="chat-input" placeholder="Сообщение...">
      <button id="chat-send">➤</button>
    </div>
  </div>
</div>

<script>
// ====== НАСТРОЙКИ — вставлены ваши данные из Supabase ======
const SUPABASE_URL = "https://dunqcvxdyfvjdkfddeic.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_famuELOrEel2muGJuvnPVw__OcfHLw-";
// ============================================================

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function getBrowserTestId() {
  let id = localStorage.getItem("test_user_id");
  if (!id) {
    id = String(Math.floor(100000000 + Math.random() * 900000000));
    localStorage.setItem("test_user_id", id);
  }
  return Number(id);
}

const tgUser = tg?.initDataUnsafe?.user;
const userId = tgUser?.id || getBrowserTestId();
const defaultName = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "";

let currentResident = null;
let events = [];
let editingEventId = null;
let searchQuery = "";
const todayDate = new Date();
let calYear = todayDate.getFullYear();
let calMonth = todayDate.getMonth();

async function init() {
  const { data: resident } = await sb.from("residents").select("*").eq("id", userId).maybeSingle();
  if (!resident) {
    document.getElementById("reg-name").value = defaultName;
    document.getElementById("reg-modal").classList.add("open");
  } else {
    currentResident = resident;
    await loadEvents();
  }
}

document.getElementById("reg-save").onclick = async () => {
  const name = document.getElementById("reg-name").value.trim();
  const address = document.getElementById("reg-address").value.trim();
  if (!name || !address) return alert("Заполните имя и адрес");
  const { data, error } = await sb.from("residents")
    .insert({ id: userId, name, address }).select().single();
  if (error) return alert("Ошибка: " + error.message);
  currentResident = data;
  document.getElementById("reg-modal").classList.remove("open");
  await loadEvents();
};

async function loadEvents() {
  const { data } = await sb
    .from("events")
    .select("*, participants(user_id, residents(name))")
    .order("date", { ascending: true });
  events = data || [];
  renderList();
  renderCalendar();
}

function matchesSearch(e, query) {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const haystack = `${e.type} ${e.description || ""}`.toLowerCase();
  return words.every(w => haystack.includes(w));
}

function renderList() {
  const el = document.getElementById("view-list");
  const query = searchQuery.trim();

  let list;
  if (query) {
    list = events.filter(e => matchesSearch(e, query)).sort((a, b) => a.date.localeCompare(b.date));
    if (!list.length) {
      el.innerHTML = `<div class="empty">По запросу «${query}» ничего не найдено</div>`;
      return;
    }
  } else {
    const today = new Date().toISOString().slice(0, 10);
    list = events.filter(e => e.date >= today);
    if (!list.length) {
      el.innerHTML = '<div class="empty">Пока нет запланированных событий</div>';
      return;
    }
  }

  el.innerHTML = list.map(renderCard).join("");
  attachCardHandlers();
}

function renderCard(e) {
  const joined = e.participants?.some(p => p.user_id === userId);
  const names = (e.participants || []).map(p => p.residents?.name).filter(Boolean).join(", ") || "пока никто";
  const dateStr = new Date(e.date + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  const isOwner = e.created_by === userId;
  return `
    <div class="card">
      <div class="type">${e.type}</div>
      <div class="when">📅 ${dateStr}${e.time ? ", " + e.time.slice(0,5) : ""}</div>
      ${e.description ? `<div class="desc">${e.description}</div>` : ""}
      <div class="who">Участники: ${names}</div>
      <div class="card-actions">
        <button class="${joined ? "btn-leave" : "btn-join"}" data-id="${e.id}" data-joined="${joined}">
          ${joined ? "Не пойду" : "Присоединиться"}
        </button>
      </div>
      ${isOwner ? `
      <div class="card-actions owner-actions">
        <button class="btn-edit" data-edit-id="${e.id}">Изменить</button>
        <button class="btn-delete" data-delete-id="${e.id}">Удалить</button>
      </div>` : ""}
      ${joined ? `<button class="btn-chat" data-chat-id="${e.id}">💬 Чат участников</button>` : ""}
    </div>`;
}

function attachCardHandlers() {
  document.querySelectorAll("[data-id]").forEach(btn => {
    btn.onclick = async () => {
      const eventId = btn.dataset.id;
      const joined = btn.dataset.joined === "true";
      if (joined) {
        await sb.from("participants").delete().eq("event_id", eventId).eq("user_id", userId);
      } else {
        await sb.from("participants").insert({ event_id: eventId, user_id: userId });
      }
      await loadEvents();
    };
  });
  document.querySelectorAll("[data-edit-id]").forEach(btn => {
    btn.onclick = () => {
      const ev = events.find(e => e.id === btn.dataset.editId);
      if (ev) openEditModal(ev);
    };
  });
  document.querySelectorAll("[data-delete-id]").forEach(btn => {
    btn.onclick = () => deleteEvent(btn.dataset.deleteId);
  });
  document.querySelectorAll("[data-chat-id]").forEach(btn => {
    btn.onclick = () => openChat(btn.dataset.chatId);
  });
}

function deleteEvent(id) {
  const doDelete = async () => {
    const { error } = await sb.from("events").delete().eq("id", id);
    if (error) return alert("Ошибка: " + error.message);
    document.getElementById("day-modal").classList.remove("open");
    await loadEvents();
  };
  if (tg?.showConfirm) {
    tg.showConfirm("Удалить это событие? Отменить будет нельзя.", (ok) => { if (ok) doDelete(); });
  } else if (confirm("Удалить это событие? Отменить будет нельзя.")) {
    doDelete();
  }
}

function openDayModal(dateStr) {
  const dayEvents = events.filter(e => e.date === dateStr);
  const label = new Date(dateStr + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  document.getElementById("day-modal-title").textContent = `События: ${label}`;
  const listEl = document.getElementById("day-modal-list");
  listEl.innerHTML = dayEvents.map(renderCard).join("") || '<div class="empty">Событий нет</div>';
  document.getElementById("day-modal").classList.add("open");
  attachCardHandlers();
}

let chatEventId = null;
let chatPollTimer = null;

function openChat(eventId) {
  const ev = events.find(e => e.id === eventId);
  chatEventId = eventId;
  document.getElementById("chat-modal-title").textContent = `💬 ${ev ? ev.type : "Чат"}`;
  document.getElementById("day-modal").classList.remove("open");
  document.getElementById("chat-modal").classList.add("open");
  loadMessages();
  if (chatPollTimer) clearInterval(chatPollTimer);
  chatPollTimer = setInterval(loadMessages, 3000);
}

function closeChat() {
  if (chatPollTimer) clearInterval(chatPollTimer);
  chatPollTimer = null;
  chatEventId = null;
}

async function loadMessages() {
  if (!chatEventId) return;
  const { data } = await sb
    .from("messages")
    .select("*, residents(name)")
    .eq("event_id", chatEventId)
    .order("created_at", { ascending: true });
  renderMessages(data || []);
}

function renderMessages(list) {
  const el = document.getElementById("chat-messages");
  if (!list.length) {
    el.innerHTML = '<div class="empty">Сообщений пока нет</div>';
    return;
  }
  el.innerHTML = list.map(m => {
    const own = m.user_id === userId;
    const name = own ? "Вы" : (m.residents?.name || "Житель");
    return `
      <div class="chat-msg ${own ? "own" : ""}">
        <div class="who">${name}</div>
        <div class="text">${m.text}</div>
      </div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

document.getElementById("chat-send").onclick = async () => {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text || !chatEventId) return;
  input.value = "";
  const { error } = await sb.from("messages").insert({ event_id: chatEventId, user_id: userId, text });
  if (error) return alert("Ошибка: " + error.message);
  await loadMessages();
};

document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("chat-send").click();
});

function openEditModal(ev) {
  document.getElementById("day-modal").classList.remove("open");
  editingEventId = ev.id;
  document.getElementById("create-modal-title").textContent = "Изменить событие";
  const predefined = ["Вывоз мусора", "Субботник", "Закупка", "Другое"];
  const typeCustomInput = document.getElementById("ev-type-custom");
  if (predefined.includes(ev.type)) {
    document.getElementById("ev-type").value = ev.type;
    typeCustomInput.style.display = "none";
    typeCustomInput.value = "";
  } else {
    document.getElementById("ev-type").value = "Другое";
    typeCustomInput.style.display = "block";
    typeCustomInput.value = ev.type;
  }
  document.getElementById("ev-date").value = ev.date;
  document.getElementById("ev-time").value = ev.time ? ev.time.slice(0,5) : "";
  document.getElementById("ev-desc").value = ev.description || "";
  document.getElementById("ev-save").textContent = "Сохранить";
  document.getElementById("create-modal").classList.add("open");
}

function renderCalendar() {
  const el = document.getElementById("view-calendar");
  const year = calYear, month = calMonth;
  const monthLabel = new Date(year, month, 1).toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  const first = new Date(year, month, 1);
  const startDay = (first.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);
  const eventDates = new Set(events.filter(e => e.date >= todayStr).map(e => e.date));

  let html = `
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">←</button>
      <h2 style="margin:0">${monthLabel}</h2>
      <button class="cal-nav-btn" id="cal-next">→</button>
    </div>
    <div class="cal-grid">`;
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(d => html += `<div class="cal-head">${d}</div>`);
  for (let i = 0; i < startDay; i++) html += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const has = eventDates.has(dateStr);
    html += `<div class="cal-day ${has ? "has-event clickable" : ""}" ${has ? `data-date="${dateStr}"` : ""}>${d}</div>`;
  }
  html += `</div>`;
  el.innerHTML = html;

  document.querySelectorAll("[data-date]").forEach(dayEl => {
    dayEl.onclick = () => openDayModal(dayEl.dataset.date);
  });

  document.getElementById("cal-prev").onclick = () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  };
  document.getElementById("cal-next").onclick = () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  };
}

document.getElementById("ev-type").onchange = (e) => {
  document.getElementById("ev-type-custom").style.display = e.target.value === "Другое" ? "block" : "none";
};

document.getElementById("search-input").oninput = (e) => {
  searchQuery = e.target.value;
  renderList();
};

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const isList = tab.dataset.tab === "list";
    document.getElementById("view-list").style.display = isList ? "block" : "none";
    document.getElementById("view-calendar").style.display = isList ? "none" : "block";
    document.getElementById("search-input").style.display = isList ? "block" : "none";
  };
});

document.getElementById("fab-add").onclick = () => {
  editingEventId = null;
  document.getElementById("create-modal-title").textContent = "Новое событие";
  document.getElementById("ev-save").textContent = "Создать";
  document.getElementById("ev-type").value = "Вывоз мусора";
  document.getElementById("ev-type-custom").style.display = "none";
  document.getElementById("ev-type-custom").value = "";
  document.getElementById("ev-date").value = "";
  document.getElementById("ev-time").value = "";
  document.getElementById("ev-desc").value = "";
  document.getElementById("create-modal").classList.add("open");
};

document.getElementById("ev-save").onclick = async () => {
  let type = document.getElementById("ev-type").value;
  if (type === "Другое") {
    const custom = document.getElementById("ev-type-custom").value.trim();
    if (custom) type = custom;
  }
  const date = document.getElementById("ev-date").value;
  const time = document.getElementById("ev-time").value;
  const description = document.getElementById("ev-desc").value.trim();
  if (!date) return alert("Укажите дату");

  let error;
  if (editingEventId) {
    ({ error } = await sb.from("events")
      .update({ type, date, time: time || null, description })
      .eq("id", editingEventId));
  } else {
    ({ error } = await sb.from("events")
      .insert({ type, date, time: time || null, description, created_by: userId }));
  }
  if (error) return alert("Ошибка: " + error.message);

  editingEventId = null;
  document.getElementById("create-modal").classList.remove("open");
  document.getElementById("ev-date").value = "";
  document.getElementById("ev-time").value = "";
  document.getElementById("ev-desc").value = "";
  document.getElementById("ev-type-custom").value = "";
  document.getElementById("ev-type-custom").style.display = "none";
  await loadEvents();
};

document.querySelectorAll(".modal-bg").forEach(m => {
  m.onclick = (e) => {
    if (e.target === m && m.id !== "reg-modal") {
      m.classList.remove("open");
      if (m.id === "chat-modal") closeChat();
    }
  };
});

init();
</script>
</body>
</html>
